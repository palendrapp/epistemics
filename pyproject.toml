[project]
name = "epistemics"
version = "0.1.0"
description = "Behavioral belief elicitation for agents, with verifiable epistemic records"
requires-python = ">=3.12,<3.15"
dependencies = ["mcp>=1.26,<2", "numpy>=2.2,<3", "pydantic>=2.11,<3"]

[project.scripts]
epistemics = "epistemics.cli:main"
epistemics-mcp = "epistemics.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
