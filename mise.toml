[tools]
node = "24.14.0"
pnpm = "11.20.0"
uv = "0.10.12"

[tasks.setup]
run = ["uv sync --locked"]

[tasks.dev]
run = "uv run epistemics-mcp"

[tasks.demo]
run = "uv run epistemics demo --output output/demo-report.json"

[tasks.test]
run = ["uv run pytest"]

[tasks.check]
run = ["uv run ruff check .", "uv run ruff format --check .", "uv run pytest"]

[tasks.format]
run = ["uv run ruff check --fix .", "uv run ruff format ."]
